name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Rodar setup.ps1 (onboarding completo)
        run: pwsh -File ./setup.ps1

      - name: Verificar workspace
        run: |
          cd ..
          uv run platform version
