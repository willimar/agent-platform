nome: "Echo Agent"
versao: "1.0.0"
modelo: "llama3.1:8b"
instrucoes: >
  Você é um agente que repete mensagens e faz cálculos simples.
  Use as ferramentas disponíveis quando necessário.
ferramentas:
  - echo_repetir
  - math_somar
tarefa:
  descricao: "Mensagem do usuário: 'Enviar resultado da soma para o Limar', Somar: 2+3."
  saida_esperada: >
    Uma mensagem contendo a mensagem do usuário e o resultado da soma.
max_passos: 50
metadata:
  autor: "exemplo"